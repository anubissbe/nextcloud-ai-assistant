---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: localai-models
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: nextcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      containers:
      - name: localai
        image: localai/localai:latest-aio-cpu
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: THREADS
          value: "4"
        - name: CONTEXT_SIZE
          value: "2048"
        - name: MODELS_PATH
          value: "/models"
        - name: REBUILD
          value: "false"
        volumeMounts:
        - name: models
          mountPath: /models
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: localai-models
---
apiVersion: v1
kind: Service
metadata:
  name: localai
  namespace: nextcloud
spec:
  selector:
    app: localai
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
