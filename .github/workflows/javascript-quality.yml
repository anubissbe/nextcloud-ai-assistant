name: JavaScript/Vue Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint
      continue-on-error: true

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Stylelint
      run: npm run stylelint
      continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.1

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: built-assets
        path: |
          js/
          css/
        retention-days: 7
